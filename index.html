<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Payment</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0518;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #140d26;
            border: 2px solid #3b1d66;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 0 40px rgba(147, 51, 234, 0.2);
        }
        h1 {
            font-size: 42px;
            margin-top: 0;
            margin-bottom: 30px;
            color: #d946ef;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(217, 70, 239, 0.6), 0 0 40px rgba(217, 70, 239, 0.3);
        }
        .pay-badge {
            display: inline-flex;
            align-items: center;
            border: 1px solid #4c2885;
            border-radius: 12px;
            padding: 6px 16px;
            font-size: 14px;
            color: #a78bfa;
            margin-bottom: 20px;
            background: rgba(76, 40, 133, 0.2);
        }
        h2 {
            font-size: 22px;
            margin: 0 0 8px 0;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #9ca3af;
            margin: 0 0 25px 0;
            line-height: 1.4;
        }
        .qr-box {
            background-color: #ffffff;
            padding: 16px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
        }
        .qr-box img {
            width: 230px;
            height: 230px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WELCOME</h1>
    
    <div class="pay-badge">
        <span>✨ UPI Payment</span>
    </div>
    
    <h2>Scan to pay</h2>
    <p>Use PhonePe, Google Pay, Paytm, or any UPI app to scan the code below.</p>
    
    <div class="qr-box">
        <img src="https://postimg.cc" alt="UPI QR Code">
    </div>
</div>

</body>
</html>
