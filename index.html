<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Payment</title>
    <style>
        /* हर सेकंड रंग बदलने वाला बैकग्राउंड एनीमेशन */
        body {
            margin: 0;
            padding: 0;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #0b0518, #1f0b3a, #051429, #1c051c);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            25% { background-position: 50% 100%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 0%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background-color: rgba(20, 13, 38, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* WELCOME टेक्स्ट का रंग भी हर सेकंड बदलेगा */
        h1 {
            font-size: 42px;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: textColorChange 5s linear infinite;
        }

        @keyframes textColorChange {
            0% { color: #d946ef; text-shadow: 0 0 20px rgba(217, 70, 239, 0.6); }
            33% { color: #3b82f6; text-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }
            66% { color: #10b981; text-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
            100% { color: #d946ef; text-shadow: 0 0 20px rgba(217, 70, 239, 0.6); }
        }

        .pay-badge {
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 6px 16px;
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        h2 {
            font-size: 22px;
            margin: 0 0 8px 0;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            color: #d1d5db;
            margin: 0 0 25px 0;
            line-height: 1.4;
        }

        .qr-box {
            background-color: #ffffff;
            padding: 16px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        .qr-box img {
            width: 230px;
            height: 230px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WELCOME</h1>
    
    <div class="pay-badge">
        <span>✨ RGB UPI Payment</span>
    </div>
    
    <h2>Scan to pay</h2>
    <p>Use PhonePe, Google Pay, Paytm, or any UPI app to scan the code below.</p>
    
    <div class="qr-box">
        <!-- आपका 100% वर्किंग QR कोड जो कभी गायब नहीं होगा -->
        <img src="https://qrserver.com" alt="UPI QR Code">
    </div>
</div>

</body>
</html>
