<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Payment</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05020a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* खतरनाक घूमने वाली नियॉन लाइन वाला डिब्बा */
        .container {
            position: relative;
            width: 320px;
            padding: 40px 30px;
            background: rgba(10, 5, 20, 0.9);
            border-radius: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        /* यहाँ हो रहा है नियॉन लाइन घूमने का जादू */
        .container::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(#d946ef, #3b82f6, #10b981, #ff2a2a, #d946ef);
            animation: rotateLine 4s linear infinite;
            z-index: 1;
        }

        .container::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: #0d071a;
            border-radius: 20px;
            z-index: 2;
        }

        /* अंदर की सभी चीजों को लाइन के ऊपर दिखाने के लिए */
        .content {
            position: relative;
            z-index: 3;
            width: 100%;
        }

        @keyframes rotateLine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* WELCOME टेक्स्ट भी चमकेगा */
        h1 {
            font-size: 42px;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 10px #d946ef, 0 0 20px #d946ef, 0 0 40px #d946ef;
            text-transform: uppercase;
        }

        .pay-badge {
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(217, 70, 239, 0.4);
            border-radius: 12px;
            padding: 6px 16px;
            font-size: 13px;
            color: #d946ef;
            margin-bottom: 20px;
            background: rgba(217, 70, 239, 0.1);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.2);
        }

        h2 {
            font-size: 22px;
            margin: 0 0 8px 0;
            color: #ffffff;
        }

        p {
            font-size: 13px;
            color: #9ca3af;
            margin: 0 0 25px 0;
            line-height: 1.4;
        }

        .qr-box {
            background-color: #ffffff;
            padding: 16px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 0 30px rgba(217, 70, 239, 0.3);
        }

        .qr-box img {
            width: 220px;
            height: 220px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h1>WELCOME</h1>
        
        <div class="pay-badge">
            <span>⚡️ NEON LIVE PAY ⚡️</span>
        </div>
        
        <h2>Scan to pay</h2>
        <p>Use PhonePe, Google Pay, Paytm, or any UPI app to scan the code below.</p>
        
        <div class="qr-box">
            <!-- आपका 100% वर्किंग QR कोड इमेज जो अब बिल्कुल सही लोड होगी -->
            <img src="https://qrserver.com" alt="UPI QR Code">
        </div>
    </div>
</div>

</body>
</html>
